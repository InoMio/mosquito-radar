<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071a22">
  <title>모기 퇴치 — 움직임 탐지 실험실</title>
  <style>
    :root{color-scheme:dark;--bg:#081922;--panel:#102832;--mint:#67ebbd;--text:#f1f8fb;--soft:#a4bec8;--border:#29434d;--red:#ff766a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
    .app{max-width:800px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;gap:8px}header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.04em}header small{display:block;font-size:11px;color:var(--soft);font-weight:500;letter-spacing:0}
    .tag{background:#123b34;color:var(--mint);padding:6px 9px;border:1px solid #28584e;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    .view{position:relative;overflow:hidden;min-height:300px;flex:1;background:#071218;border-block:1px solid #1f3941;max-height:75dvh}
    video,.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{pointer-events:none}
    .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--soft)}
    .empty strong{color:var(--text);font-size:18px}.lens{font-size:54px;filter:drop-shadow(0 0 20px #45be9899)}
    .top-hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
    .pill{padding:6px 10px;border-radius:9px;background:#071b20d9;border:1px solid #234c53;font-size:12px;font-weight:700}
    .pill strong{color:var(--mint)}.foot-hud{position:absolute;bottom:12px;left:12px;right:12px;background:#071b20e8;border:1px solid #234c53;border-radius:9px;padding:9px 12px;font-size:13px;pointer-events:none}
    .controls{padding:14px 14px 9px;background:var(--bg)}button,select,input{font:inherit}
    .action{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:750;cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--border)}
    .btn.main{background:var(--mint);color:#08221a;border:1px solid var(--mint);flex:1}.btn.stop{background:#51302e;border-color:#80514d;color:#ffd5cf}
    .opts{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px}
    .opts label{color:var(--soft);font-size:12px}.opts select{margin-left:5px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:#0d222b}.stat span{font-size:11px;color:var(--soft);display:block}.stat b{font-size:16px}
    .note{font-size:12px;color:var(--soft);margin:11px 0 0}.note strong{color:#ffd48a}
    #error{display:none;margin-top:9px;border:1px solid #8f514e;background:#422525;color:#ffdfdc;border-radius:9px;padding:10px;font-size:13px}
    @media(max-width:400px){.btn{padding:11px}header h1{font-size:18px}.view{min-height:280px}.stats{gap:6px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>◎ 모기 퇴치</h1><small>움직이는 작은 물체 찾기 · v0.2</small></div><div class="tag" id="mode">실험용 시제품</div></header>
    <section class="view" id="viewport" aria-label="실시간 카메라 영상">
      <video id="camera" autoplay muted playsinline></video>
      <canvas class="overlay" id="overlay"></canvas>
      <div class="empty" id="empty"><div class="lens">◎</div><strong>카메라 수색 준비 완료</strong><div>휴대폰을 천천히 움직이며<br>벽과 천장을 살펴보세요.</div></div>
      <div class="top-hud"><div class="pill">움직임 후보 <strong id="count">0</strong>개</div><div class="pill" id="quality">대기 중</div></div>
      <div class="foot-hud" id="message">탐색 시작을 누르면 후면 카메라가 켜집니다.</div>
    </section>
    <section class="controls">
      <div class="action"><button class="btn main" id="start">📷 탐색 시작</button><button class="btn stop" id="stop" disabled>종료</button><button class="btn" id="clear" aria-label="추적 초기화">↺</button></div>
      <div class="opts">
        <label>감도<select id="sensitivity"><option value="82" selected>낮음 (오탐↓)</option><option value="60">보통</option><option value="45">높음 (오탐↑)</option></select></label>
        <label>분석 화질<select id="resolution"><option value="540">빠름</option><option value="720" selected>표준</option><option value="960">정밀 (발열↑)</option></select></label>
        <label><input id="vibrate" type="checkbox" checked> 감지 시 진동</label>
      </div>
      <div class="stats"><div class="stat"><span>분석 속도</span><b id="fps">0 fps</b></div><div class="stat"><span>분석 해상도</span><b id="res">-</b></div><div class="stat"><span>현재 추적</span><b id="tracks">0개</b></div></div>
      <div id="error" role="alert"></div>
      <p class="note"><strong>중요:</strong> 이 버전은 AI 모기 식별기가 아닙니다. 배경보다 독립적으로 움직인 작은 점을 표시하며, 먼지·그림자 등 오탐이 남을 수 있습니다. 브라우저의 HTTPS 주소에서 실행하세요. 영상은 서버로 전송하거나 저장하지 않습니다.</p>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const video=$('camera'), overlay=$('overlay'), viewport=$('viewport'), ctx=overlay.getContext('2d');
  const work=document.createElement('canvas'), wctx=work.getContext('2d',{willReadFrequently:true});
  let stream=null,running=false,processing=false,lastAnalysis=0,prev=null,prevCoarse=null,tracks=[],seq=0;
  let frameCount=0,fpsStart=0,lastBuzz=0,width=720,height=1280,coarseW=0,coarseH=0;
  let cameraX=0,cameraY=0,flags=null,seen=null,queue=null;
  const msg = s => $('message').textContent=s;
  const reset = () => {
    prev=null;prevCoarse=null;tracks=[];seq=0;cameraX=0;cameraY=0;frameCount=0;
    lastAnalysis=0;fpsStart=performance.now();$('count').textContent='0';$('tracks').textContent='0개';
  };
  function configure(){
    width=Number($('resolution').value);
    height=Math.max(1,Math.round(width*(video.videoHeight||720)/(video.videoWidth||1280)));
    work.width=width;work.height=height;coarseW=Math.ceil(width/5);coarseH=Math.ceil(height/5);
    flags=new Uint8Array(width*height);seen=new Uint8Array(width*height);queue=new Int32Array(width*height);
    reset();$('res').textContent=width+'×'+height;
  }
  function resizeOverlay(){const r=viewport.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);overlay.width=Math.round(r.width*d);overlay.height=Math.round(r.height*d);}
  function grayAndCoarse(rgba){
    const gray=new Uint8Array(width*height),cw=coarseW,ch=coarseH,coarse=new Uint8Array(cw*ch);
    for(let p=0,i=0;i<gray.length;i++,p+=4)gray[i]=(rgba[p]*77+rgba[p+1]*150+rgba[p+2]*29)>>8;
    for(let y=0;y<ch;y++){const sy=Math.min(height-1,y*5+2);for(let x=0;x<cw;x++)coarse[y*cw+x]=gray[sy*width+Math.min(width-1,x*5+2)];}
    return {gray,coarse};
  }
  // 연속 프레임 전체 배경의 평행 이동을 추정합니다. 수색 중 손 움직임을 보정하기 위한 첫 단계입니다.
  function estimateShift(oldFrame,newFrame){
    let best={dx:0,dy:0,score:Infinity},cw=coarseW,ch=coarseH;
    for(let dy=-9;dy<=9;dy++)for(let dx=-9;dx<=9;dx++){
      let total=0,n=0;
      for(let y=11;y<ch-11;y+=8){const yy=y+dy;
        for(let x=11;x<cw-11;x+=8){const xx=x+dx;total+=Math.abs(oldFrame[y*cw+x]-newFrame[yy*cw+xx]);n++;}
      }
      if(n&&total/n<best.score)best={dx,dy,score:total/n};
    }
    return best;
  }
  function refineShift(oldFrame,newFrame,bx,by){
    let best={dx:bx,dy:by,score:Infinity};
    for(let dy=by-2;dy<=by+2;dy++)for(let dx=bx-2;dx<=bx+2;dx++){
      let err=0,n=0;
      for(let y=20;y<height-20;y+=11){const py=y-dy;if(py<=1||py>=height-1)continue;
        for(let x=20;x<width-20;x+=11){const px=x-dx;if(px<=1||px>=width-1)continue;
          const j=py*width+px,i=y*width+x;
          // 충분한 질감이 있는 배경을 정렬 기준으로 사용합니다.
          if(Math.abs(oldFrame[j]-oldFrame[j+1])+Math.abs(oldFrame[j]-oldFrame[j+width])<10)continue;
          err+=Math.min(100,Math.abs(newFrame[i]-oldFrame[j]));n++;
        }
      }
      if(n>=25&&err/n<best.score)best={dx,dy,score:err/n};
    }
    return best;
  }
  function findBlobs(current,old,dx,dy,threshold){
    flags.fill(0);seen.fill(0);let active=0;
    const y0=Math.max(3,dy+3),y1=Math.min(height-3,height+dy-3);
    const x0=Math.max(3,dx+3),x1=Math.min(width-3,width+dx-3);
    // 배경 양쪽 프레임에 모두 강한 윤곽선이 있다면 카메라 흔들림에서 생긴 잔상일 가능성이 큽니다.
    for(let y=y0;y<y1;y++){
      const row=y*width,pr=(y-dy)*width;
      for(let x=x0;x<x1;x++){
        const i=row+x,j=pr+x-dx,diff=Math.abs(current[i]-old[j]);
        if(diff<=threshold)continue;
        const oldGrad=Math.abs(old[j-1]-old[j+1])+Math.abs(old[j-width]-old[j+width]);
        const newGrad=Math.abs(current[i-1]-current[i+1])+Math.abs(current[i-width]-current[i+width]);
        if(oldGrad>75&&newGrad>75)continue;
        flags[i]=1;active++;
      }
    }
    if(active>width*height*.022)return {result:[],noise:true};
    const result=[];
    for(let y=4;y<height-4;y++)for(let x=4;x<width-4;x++){
      const start=y*width+x;if(!flags[start]||seen[start])continue;
      let head=0,tail=1,minx=x,maxx=x,miny=y,maxy=y,amount=0,sx=0,sy=0;
      queue[0]=start;seen[start]=1;
      while(head<tail){
        const p=queue[head++],py=(p/width)|0,px=p-py*width;
        amount++;sx+=px;sy+=py;
        if(px<minx)minx=px;if(px>maxx)maxx=px;if(py<miny)miny=py;if(py>maxy)maxy=py;
        for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
          if(!ox&&!oy)continue;
          const nx=px+ox,ny=py+oy;if(nx<2||ny<2||nx>=width-2||ny>=height-2)continue;
          const q=ny*width+nx;
          if(flags[q]&&!seen[q]){seen[q]=1;queue[tail++]=q;}
        }
      }
      const bw=maxx-minx+1,bh=maxy-miny+1,aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));
      if(amount>=3&&amount<=110&&bw<=20&&bh<=20&&aspect<=4.5){
        result.push({x:sx/amount,y:sy/amount,size:Math.max(bw,bh),area:amount});
        if(result.length>=120)break;
      }
    }
    return {result,noise:false};
  }
  // 카메라 이동량을 누적해 각 후보를 방 안의 배경 기준 좌표로 변환합니다.
  // 벽/옷걸이 무늬처럼 카메라와 함께 움직이는 잔상은 같은 배경 좌표에 머무르므로 경고에서 제외됩니다.
  function linkTracks(blobs,t){
    const used=new Set();
    for(const tr of tracks){
      let chosen=-1,minDist=Infinity;
      for(let i=0;i<blobs.length;i++){
        if(used.has(i))continue;
        const b=blobs[i],wx=b.x-cameraX,wy=b.y-cameraY;
        const dist=Math.hypot(wx-tr.wx,wy-tr.wy);
        if(dist<Math.max(22,width*.055)&&dist<minDist){minDist=dist;chosen=i;}
      }
      if(chosen<0)continue;
      const b=blobs[chosen],wx=b.x-cameraX,wy=b.y-cameraY;
      const step=Math.hypot(wx-tr.wx,wy-tr.wy);
      tr.movement+=step;tr.wx=wx;tr.wy=wy;tr.x=b.x;tr.y=b.y;tr.size=b.size;
      tr.hits++;tr.last=t;
      tr.path.push({wx,wy});if(tr.path.length>12)tr.path.shift();
      used.add(chosen);
    }
    for(let i=0;i<blobs.length;i++){
      if(used.has(i))continue;
      const b=blobs[i],wx=b.x-cameraX,wy=b.y-cameraY;
      tracks.push({id:++seq,x:b.x,y:b.y,wx,wy,size:b.size,hits:1,movement:0,last:t,path:[{wx,wy}]});
    }
    tracks=tracks.filter(tr=>t-tr.last<650).sort((a,b)=>b.hits-a.hits).slice(0,50);
    const confirmed=[];for(const tr of tracks.filter(tr=>tr.hits>=4&&tr.movement>=12&&t-tr.last<350)){if(confirmed.every(p=>Math.hypot(p.x-tr.x,p.y-tr.y)>18))confirmed.push(tr);if(confirmed.length>=4)break;}
    const tentative=tracks.filter(tr=>tr.hits>=3&&tr.movement>=7&&t-tr.last<350);
    $('count').textContent=String(confirmed.length);$('tracks').textContent=tentative.length+'개';
    if(confirmed.length&&$('vibrate').checked&&t-lastBuzz>2800){navigator.vibrate?.(50);lastBuzz=t;}
    return {confirmed:confirmed.length,tentative:tentative.length};
  }
  function draw(){
    const d=overlay.width/(viewport.clientWidth||1);ctx.clearRect(0,0,overlay.width,overlay.height);
    if(!running||!video.videoWidth)return;
    const vw=viewport.clientWidth,vh=viewport.clientHeight,sourceRatio=video.videoWidth/video.videoHeight,viewRatio=vw/vh;
    let dispW,dispH,offX,offY;
    if(sourceRatio>viewRatio){dispH=vh;dispW=vh*sourceRatio;offX=(vw-dispW)/2;offY=0;}
    else {dispW=vw;dispH=vw/sourceRatio;offX=0;offY=(vh-dispH)/2;}
    const toScreen=p=>({x:(offX+(p.wx+cameraX)/width*dispW)*d,y:(offY+(p.wy+cameraY)/height*dispH)*d});
    const now=performance.now();let drawn=0;const shown=[];
    for(const tr of tracks){
      if(now-tr.last>450||tr.hits<3||tr.movement<7||drawn>=5)continue;
      if(shown.some(p=>Math.hypot(p.x-tr.x,p.y-tr.y)<18))continue;
      shown.push(tr);drawn++;
      const strong=tr.hits>=4&&tr.movement>=12;
      const at=toScreen(tr),color=strong?'#ff7569':'#ffdd86';
      ctx.strokeStyle=color;ctx.lineWidth=(strong?2.8:1.7)*d;
      ctx.beginPath();ctx.arc(at.x,at.y,Math.max(12*d,tr.size*dispW/width*d+4*d),0,Math.PI*2);ctx.stroke();
      if(tr.path.length>=2){ctx.beginPath();tr.path.forEach((p,i)=>{const v=toScreen(p);if(i===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);});ctx.lineWidth=1.5*d;ctx.stroke();}
    }
  }
  function analyze(t){
    if(!running||processing||video.readyState<2||t-lastAnalysis<65)return;
    lastAnalysis=t;processing=true;
    try{
      wctx.drawImage(video,0,0,width,height);
      const {data}=wctx.getImageData(0,0,width,height),curr=grayAndCoarse(data);
      if(prev&&prevCoarse){
        const coarse=estimateShift(prevCoarse,curr.coarse);
        const shift=refineShift(prev,curr.gray,coarse.dx*5,coarse.dy*5);
        const boundary=Math.abs(coarse.dx)>=9||Math.abs(coarse.dy)>=9;
        const unreliable=!Number.isFinite(shift.score)||shift.score>29||coarse.score>41||boundary;
        if(unreliable){
          tracks=[];$('count').textContent='0';$('tracks').textContent='0개';
          $('quality').textContent='흔들림/배경 변화';
          msg('배경 정렬이 불안정해 잠시 탐지를 쉬고 있어요. 휴대폰을 조금 더 천천히 움직여 주세요.');
        }else{
          cameraX+=shift.dx;cameraY+=shift.dy;
          const {result,noise}=findBlobs(curr.gray,prev,shift.dx,shift.dy,Number($('sensitivity').value));
          if(noise){tracks=[];$('count').textContent='0';$('tracks').textContent='0개';$('quality').textContent='변화 과다';msg('화면 변화가 너무 커요. 벽이나 천장을 향해 조금 천천히 움직여 보세요.');}
          else{
            const {confirmed,tentative}=linkTracks(result,t);
            if(confirmed){$('quality').textContent='움직임 후보';msg('빨간 원은 배경과 다르게 움직인 후보입니다. 모기인지는 눈으로 확인하세요.');}
            else if(tentative){$('quality').textContent='후보 확인 중';msg('작은 움직임을 추적하고 있어요. 잠시 같은 방향을 비춰 보세요.');}
            else{$('quality').textContent='탐색 중';msg('후보 없음. 벽과 천장을 천천히 비춰 보세요.');}
          }
        }
      }
      prev=curr.gray;prevCoarse=curr.coarse;
      frameCount++;
      if(t-fpsStart>=1100){$('fps').textContent=(frameCount*1000/(t-fpsStart)).toFixed(1)+' fps';fpsStart=t;frameCount=0;}
    }catch(e){showError('영상 분석 오류: '+e.message);}finally{processing=false;}
  }
  function loop(t){if(!running)return;analyze(t);draw();requestAnimationFrame(loop);}
  function showError(s){$('error').textContent=s;$('error').style.display='block';msg('오류가 발생했어요. 아래 내용을 확인하세요.');}
  async function start(){
    if(running)return;$('error').style.display='none';
    if(!navigator.mediaDevices?.getUserMedia){showError('카메라 API를 사용할 수 없습니다. HTTPS Replit 링크를 Chrome에서 여세요.');return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}}});
      video.srcObject=stream;await video.play();running=true;
      $('start').disabled=true;$('stop').disabled=false;$('empty').style.display='none';$('mode').textContent='v0.2 수색 중';
      configure();resizeOverlay();msg('처음 프레임을 확보하고 있어요. 휴대폰을 천천히 움직여 주세요.');requestAnimationFrame(loop);
    }catch(e){showError('카메라 시작 실패 ('+e.name+'): '+e.message);}
  }
  function stop(){
    running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);
    $('start').disabled=false;$('stop').disabled=true;$('empty').style.display='flex';$('mode').textContent='실험용 시제품';
    $('quality').textContent='대기 중';msg('탐색이 종료되었습니다.');reset();
  }
  $('start').addEventListener('click',start);$('stop').addEventListener('click',stop);
  $('clear').addEventListener('click',()=>{reset();msg('추적 기록을 초기화했습니다.');});
  $('resolution').addEventListener('change',()=>{if(running)configure();});
  $('sensitivity').addEventListener('change',()=>{tracks=[];});
  window.addEventListener('resize',resizeOverlay);window.addEventListener('pagehide',stop);resizeOverlay();
})();
</script>
</body>
</html>
