<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071a22">
  <title>모기 퇴치 — 움직임 탐지 실험실</title>
  <style>
    :root{color-scheme:dark;--bg:#081922;--panel:#102832;--mint:#67ebbd;--text:#f1f8fb;--soft:#a4bec8;--border:#29434d;--red:#ff766a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
    .app{max-width:800px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;gap:8px}header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.04em}header small{display:block;font-size:11px;color:var(--soft);font-weight:500;letter-spacing:0}
    .tag{background:#123b34;color:var(--mint);padding:6px 9px;border:1px solid #28584e;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    .view{position:relative;overflow:hidden;min-height:300px;flex:1;background:#071218;border-block:1px solid #1f3941;max-height:75dvh}
    video,.overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.overlay{pointer-events:none}
    .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--soft)}
    .empty strong{color:var(--text);font-size:18px}.lens{font-size:54px;filter:drop-shadow(0 0 20px #45be9899)}
    .top-hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
    .pill{padding:6px 10px;border-radius:9px;background:#071b20d9;border:1px solid #234c53;font-size:12px;font-weight:700}
    .pill strong{color:var(--mint)}.foot-hud{position:absolute;bottom:12px;left:12px;right:12px;background:#071b20e8;border:1px solid #234c53;border-radius:9px;padding:9px 12px;font-size:13px;pointer-events:none}
    .controls{padding:14px 14px 9px;background:var(--bg)}button,select,input{font:inherit}
    .action{display:flex;gap:9px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:750;cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--border)}
    .btn.main{background:var(--mint);color:#08221a;border:1px solid var(--mint);flex:1}.btn.stop{background:#51302e;border-color:#80514d;color:#ffd5cf}
    .opts{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:13px}
    .opts label{color:var(--soft);font-size:12px}.opts select{margin-left:5px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:6px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:#0d222b}.stat span{font-size:11px;color:var(--soft);display:block}.stat b{font-size:16px}
    .note{font-size:12px;color:var(--soft);margin:11px 0 0}.note strong{color:#ffd48a}
    #error{display:none;margin-top:9px;border:1px solid #8f514e;background:#422525;color:#ffdfdc;border-radius:9px;padding:10px;font-size:13px}
    @media(max-width:400px){.btn{padding:11px}header h1{font-size:18px}.view{min-height:280px}.stats{gap:6px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div><h1>◎ 모기 퇴치</h1><small>움직이는 작은 물체 찾기 · v0.3</small></div><div class="tag" id="mode">실험용 시제품</div></header>
    <section class="view" id="viewport" aria-label="실시간 카메라 영상">
      <video id="camera" autoplay muted playsinline></video>
      <canvas class="overlay" id="overlay"></canvas>
      <div class="empty" id="empty"><div class="lens">◎</div><strong>카메라 수색 준비 완료</strong><div>휴대폰을 천천히 움직이며<br>벽과 천장을 살펴보세요.</div></div>
      <div class="top-hud"><div class="pill">움직임 후보 <strong id="count">0</strong>개</div><div class="pill" id="quality">대기 중</div></div>
      <div class="foot-hud" id="message">탐색 시작을 누르면 후면 카메라가 켜집니다.</div>
    </section>
    <section class="controls">
      <div class="action"><button class="btn main" id="start">📷 탐색 시작</button><button class="btn stop" id="stop" disabled>종료</button><button class="btn" id="clear" aria-label="추적 초기화">↺</button></div>
      <div class="opts">
        <label>감도<select id="sensitivity"><option value="64" selected>낮음 (오탐↓)</option><option value="47">보통</option><option value="34">높음 (오탐↑)</option></select></label>
        <label>분석 화질<select id="resolution"><option value="480">빠름</option><option value="640" selected>표준 (추천)</option><option value="960">정밀 (느림·발열↑)</option></select></label>
        <label><input id="vibrate" type="checkbox" checked> 감지 시 진동</label>
      </div>
      <div class="stats"><div class="stat"><span>분석 속도</span><b id="fps">0 fps</b></div><div class="stat"><span>분석 해상도</span><b id="res">-</b></div><div class="stat"><span>현재 추적</span><b id="tracks">0개</b></div></div>
      <div id="error" role="alert"></div>
      <p class="note"><strong>중요:</strong> v0.3은 AI 모기 식별기가 아닙니다. 카메라 이동을 보정하고 작은 움직임 후보만 표시합니다. TV·빛·먼지·천은 오탐일 수 있고, 작은 모기를 놓칠 수도 있습니다. 영상은 서버로 전송하거나 저장하지 않습니다.</p>
    </section>
  </main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const video = $('camera'), overlay = $('overlay'), viewport = $('viewport');
  const ctx = overlay.getContext('2d');
  const work = document.createElement('canvas'), wctx = work.getContext('2d', {willReadFrequently: true});
  let stream=null, running=false, lastAnalysis=0, lastBuzz=0, prev=null, prevSmall=null, tracks=[], sequence=0;
  let width=640,height=960,smallW=0,smallH=0, gridW=0,gridH=0, flags,seen,queue;
  let worldX=0,worldY=0, lastGood=0, samples=0, fpsStart=0, cameraWarning=false;
  let failed=0, eventText='', currentCandidates=0, lastUpdate=0;
  const STEP=2, SMALL=8;
  const msg = s => {if(eventText!==s){eventText=s;$('message').textContent=s;}};
  function reset(){ prev=null;prevSmall=null;tracks=[];sequence=0;worldX=0;worldY=0;failed=0;lastAnalysis=0;lastGood=0;samples=0;fpsStart=performance.now();
    $('count').textContent='0';$('tracks').textContent='0개';$('fps').textContent='0 fps';}
  function configure(){
    width=Number($('resolution').value);height=Math.max(1,Math.round(width*video.videoHeight/video.videoWidth));
    work.width=width;work.height=height;
    smallW=Math.ceil(width/SMALL);smallH=Math.ceil(height/SMALL);
    gridW=Math.ceil(width/STEP);gridH=Math.ceil(height/STEP);
    flags=new Uint8Array(gridW*gridH);seen=new Uint8Array(gridW*gridH);queue=new Int32Array(gridW*gridH);
    $('res').textContent=width+'×'+height;reset();
  }
  function resizeOverlay(){ const rect=viewport.getBoundingClientRect(),scale=Math.min(window.devicePixelRatio||1,2);
    overlay.width=Math.max(1,Math.round(rect.width*scale));overlay.height=Math.max(1,Math.round(rect.height*scale));}
  function imageInfo(data){
    const gray=new Uint8Array(width*height),small=new Uint8Array(smallW*smallH);
    for(let k=0,p=0;k<gray.length;k++,p+=4)gray[k]=(data[p]*77+data[p+1]*150+data[p+2]*29)>>8;
    for(let y=0;y<smallH;y++){
      const yy=Math.min(height-1,y*SMALL+4),row=yy*width;
      for(let x=0;x<smallW;x++)small[y*smallW+x]=gray[row+Math.min(width-1,x*SMALL+4)];
    }
    return {gray,small};
  }
  // Coarse-to-fine translation compensation. The coarse search covers ~120 px in all directions.
  function estimateShift(oldS,newS,oldF,newF){
    let dx0=0,dy0=0,best=Infinity,quality=0;
    const maxX=Math.min(12,Math.max(0,((smallW-20)/2)|0));
    const maxY=Math.min(12,Math.max(0,((smallH-20)/2)|0));
    for(let dy=-maxY;dy<=maxY;dy++)for(let dx=-maxX;dx<=maxX;dx++){
      let cost=0,n=0;
      for(let y=maxY+2;y<smallH-maxY-2;y+=7){const r=y*smallW,rr=(y+dy)*smallW;
        for(let x=maxX+2;x<smallW-maxX-2;x+=7){
          const k=r+x;
          // Use textured pixels for scene matching; uniform regions have little information.
          const d=Math.abs(oldS[k]-newS[rr+x+dx]);cost+=Math.min(d,50);n++;
        }
      }
      if(n>=12){const score=cost/n+(dx*dx+dy*dy)*.012;if(score<best){best=score;dx0=dx*SMALL;dy0=dy*SMALL;quality=n;}}
    }
    if(!Number.isFinite(best))return {dx:0,dy:0,score:99,valid:false};
    // Fine search with sparse sampling to avoid heavy full-image matching.
    let bx=dx0,by=dy0,refined=Infinity;
    for(let dy=dy0-4;dy<=dy0+4;dy+=2)for(let dx=dx0-4;dx<=dx0+4;dx+=2){
      let cost=0,n=0;
      for(let y=22+Math.max(0,dy);y<height-22+Math.min(0,dy);y+=19){const oldY=y-dy;
        for(let x=22+Math.max(0,dx);x<width-22+Math.min(0,dx);x+=19){const oldX=x-dx,j=oldY*width+oldX,k=y*width+x;
          const edge=Math.abs(oldF[j]-oldF[j+1])+Math.abs(oldF[j]-oldF[j+width]);
          if(edge<12)continue;
          cost+=Math.min(50,Math.abs(oldF[j]-newF[k]));n++;
        }
      }
      if(n>=30&&cost/n<refined){refined=cost/n;bx=dx;by=dy;}
    }
    const nearEdge=Math.abs(dx0)>=maxX*SMALL||Math.abs(dy0)>=maxY*SMALL;
    const score=Number.isFinite(refined)?refined:best;
    return {dx:bx,dy:by,score,valid:!nearEdge && score<32 && best<34};
  }
  function findCandidates(now,old,dx,dy,threshold){
    flags.fill(0);seen.fill(0);
    let active=0,spans=[]; const endX=Math.max(1,Math.ceil(Math.abs(dx)/STEP)+3),endY=Math.max(1,Math.ceil(Math.abs(dy)/STEP)+3);
    for(let gy=endY;gy<gridH-endY;gy++){
      const y=gy*STEP,py=y-dy;
      if(py<3||py>=height-3)continue;
      for(let gx=endX;gx<gridW-endX;gx++){
        const x=gx*STEP,px=x-dx;if(px<3||px>=width-3)continue;
        const k=y*width+x,j=py*width+px,delta=Math.abs(now[k]-old[j]);
        if(delta<threshold)continue;
        const oldEdge=Math.abs(old[j-2]-old[j+2])+Math.abs(old[j-width*2]-old[j+width*2]);
        const newEdge=Math.abs(now[k-2]-now[k+2])+Math.abs(now[k-width*2]-now[k+width*2]);
        if(oldEdge>105&&newEdge>105)continue;
        flags[gy*gridW+gx]=1;active++;
      }
    }
    if(active>gridW*gridH*.025)return {list:[], noisy:true};
    const tiny=[],large=[];
    for(let gy=3;gy<gridH-3;gy++)for(let gx=3;gx<gridW-3;gx++){
      const pos=gy*gridW+gx;if(!flags[pos]||seen[pos])continue;
      let head=0,tail=1,area=0,minx=gx,maxx=gx,miny=gy,maxy=gy,sx=0,sy=0;
      seen[pos]=1;queue[0]=pos;
      while(head<tail){
        const p=queue[head++],y=(p/gridW)|0,x=p-y*gridW;
        area++;sx+=x;sy+=y;
        if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
        for(let yy=Math.max(2,y-1);yy<=Math.min(gridH-3,y+1);yy++)for(let xx=Math.max(2,x-1);xx<=Math.min(gridW-3,x+1);xx++){
          const q=yy*gridW+xx;if(flags[q]&&!seen[q]){seen[q]=1;queue[tail++]=q;}
        }
      }
      const bw=maxx-minx+1,bh=maxy-miny+1,aspect=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));
      const obj={x:sx/area*STEP,y:sy/area*STEP,size:Math.max(bw,bh)*STEP,area,bounds:[minx*STEP,miny*STEP,maxx*STEP,maxy*STEP]};
      if(area>=32 || bw>=13 || bh>=13)large.push(obj);
      else if(area>=2&&area<=31&&bw<=12&&bh<=12&&aspect<=4)tiny.push(obj);
    }
    // Suppress tiny fragments very close to a moving cloth / another large moving object.
    const list=tiny.filter(b=>!large.some(big=>b.x>=big.bounds[0]-18&&b.x<=big.bounds[2]+18&&b.y>=big.bounds[1]-18&&b.y<=big.bounds[3]+18));
    return {list:list.slice(0,80),noisy:false};
  }
  function linkTracks(list,now){
    const taken=new Set();
    // Match the stronger existing tracks first, to avoid duplicate IDs at a single target.
    tracks.sort((a,b)=>b.hits-a.hits);
    for(const tr of tracks){
      const dt=Math.max(1,now-tr.time)/1000;
      const predX=tr.wx+Math.max(-35,Math.min(35,tr.vx*dt));
      const predY=tr.wy+Math.max(-35,Math.min(35,tr.vy*dt));
      let choice=-1,d=Infinity;
      for(let i=0;i<list.length;i++){
        if(taken.has(i))continue;
        const b=list[i],wx=b.x-worldX,wy=b.y-worldY,dist=Math.hypot(wx-predX,wy-predY);
        if(dist<Math.min(35,Math.max(17,width*.038))&&dist<d){d=dist;choice=i;}
      }
      if(choice<0)continue;
      const b=list[choice],wx=b.x-worldX,wy=b.y-worldY;
      const delta=Math.hypot(wx-tr.wx,wy-tr.wy);
      tr.total+=delta;tr.vx=(wx-tr.wx)/dt*.5+tr.vx*.5;tr.vy=(wy-tr.wy)/dt*.5+tr.vy*.5;
      tr.wx=wx;tr.wy=wy;tr.x=b.x;tr.y=b.y;tr.size=b.size;
      tr.hits++;tr.time=now;tr.missed=0;
      tr.path.push({wx,wy});if(tr.path.length>10)tr.path.shift();taken.add(choice);
    }
    for(let i=0;i<list.length;i++){
      if(taken.has(i))continue;
      const b=list[i],wx=b.x-worldX,wy=b.y-worldY;
      if(tracks.some(p=>Math.hypot(p.wx-wx,p.wy-wy)<12))continue;
      tracks.push({x:b.x,y:b.y,wx,wy,size:b.size,hits:1,total:0,vx:0,vy:0,time:now,path:[{wx,wy}]});
    }
    // A stale track cannot count as a current detection. Expire rapidly to avoid dozens of ghosts.
    tracks=tracks.filter(p=>now-p.time<340).slice(0,25);
    const confirmed=[];const maybe=[];
    for(const p of tracks){
      if(now-p.time>190)continue;
      if(p.hits>=4&&p.total>=10){
        if(confirmed.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>25))confirmed.push(p);
      }else if(p.hits>=2&&p.total>=4)maybe.push(p);
    }
    confirmed.length=Math.min(confirmed.length,5);
    $('count').textContent=String(confirmed.length);$('tracks').textContent=(confirmed.length+maybe.length)+'개';
    if(confirmed.length&&$('vibrate').checked&&now-lastBuzz>3500){navigator.vibrate?.(45);lastBuzz=now;}
    return {confirmed:confirmed.length,maybe:maybe.length};
  }
  function noNewFrame(now){
    tracks=tracks.filter(p=>now-p.time<340);$('count').textContent='0';$('tracks').textContent=tracks.length+'개';
  }
  function draw(){
    ctx.clearRect(0,0,overlay.width,overlay.height);
    if(!running||!video.videoWidth)return;
    const vw=viewport.clientWidth,vh=viewport.clientHeight,sourceRatio=video.videoWidth/video.videoHeight,viewRatio=vw/vh;
    let dw,dh,ox,oy;
    if(sourceRatio>viewRatio){dh=vh;dw=vh*sourceRatio;ox=(vw-dw)/2;oy=0;}
    else {dw=vw;dh=vw/sourceRatio;ox=0;oy=(vh-dh)/2;}
    const scale=overlay.width/(vw||1);
    const toScreen=p=>({x:(ox+(p.wx+worldX)/width*dw)*scale,y:(oy+(p.wy+worldY)/height*dh)*scale});
    const now=performance.now();let shown=0;
    for(const tr of tracks){
      if(now-tr.time>250||tr.hits<3||tr.total<7||shown>=5)continue;
      shown++;const strong=tr.hits>=4&&tr.total>=10;
      ctx.strokeStyle=strong?'#ff7569':'#ffdc7e';ctx.lineWidth=(strong?2.7:1.6)*scale;
      const pos=toScreen(tr);ctx.beginPath();ctx.arc(pos.x,pos.y,Math.max(12*scale,tr.size*dw/width*scale+5*scale),0,Math.PI*2);ctx.stroke();
      if(tr.path.length>1){ctx.beginPath();tr.path.forEach((p,i)=>{const v=toScreen(p);if(!i)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);});ctx.lineWidth=1.2*scale;ctx.stroke();}
    }
  }
  function analyze(now){
    if(!running||video.readyState<2||now-lastAnalysis<42)return;
    lastAnalysis=now;
    try{
      wctx.drawImage(video,0,0,width,height);
      const frame=imageInfo(wctx.getImageData(0,0,width,height).data);
      if(prev&&prevSmall){
        const motion=estimateShift(prevSmall,frame.small,prev,frame.gray);
        if(!motion.valid){
          failed++;noNewFrame(now);$('quality').textContent='보정 중';
          msg('카메라 움직임이 크거나 배경이 불안정해요. 잠시 천천히 비춰 보세요.');
          if(failed>4){prev=null;prevSmall=null;failed=0;tracks=[];}
        }else{
          failed=0;worldX+=motion.dx;worldY+=motion.dy;
          const result=findCandidates(frame.gray,prev,motion.dx,motion.dy,Number($('sensitivity').value));
          if(result.noisy){noNewFrame(now);$('quality').textContent='변화 과다';msg('TV·천·그림자 등 큰 변화가 있어요. 모기 후보로 표시하지 않았어요.');}
          else{
            const status=linkTracks(result.list,now);
            if(status.confirmed){$('quality').textContent='움직임 후보';msg('빨간 원은 작은 움직임 후보입니다. 아직 모기 식별 AI는 없어요.');}
            else if(status.maybe){$('quality').textContent='검증 중';msg('작은 움직임을 이어서 확인하고 있어요.');}
            else{$('quality').textContent='탐색 중';msg('확인된 후보가 없어요. 벽·천장을 천천히 비춰 보세요.');}
          }
          lastGood=now;
        }
      }
      prev=frame.gray;prevSmall=frame.small;samples++;
      if(now-fpsStart>1100){$('fps').textContent=(samples*1000/(now-fpsStart)).toFixed(1)+' fps';samples=0;fpsStart=now;}
    }catch(e){showError('분석 오류: '+e.message);}
  }
  function loop(t){if(!running)return;analyze(t);draw();requestAnimationFrame(loop);}
  function showError(message){$('error').textContent=message;$('error').style.display='block';msg('오류가 발생했습니다. 아래 안내를 확인하세요.');}
  async function start(){
    if(running)return;$('error').style.display='none';
    if(!navigator.mediaDevices?.getUserMedia){showError('카메라 권한을 사용할 수 없습니다. HTTPS 주소를 크롬에서 열어 주세요.');return;}
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});
      video.srcObject=stream;await video.play();running=true;
      $('start').disabled=true;$('stop').disabled=false;$('empty').style.display='none';$('mode').textContent='v0.3 수색 중';
      configure();resizeOverlay();msg('모기 의심 물체를 찾고 있어요.');requestAnimationFrame(loop);
    }catch(e){showError('카메라 시작 실패 ('+e.name+'): '+e.message);}
  }
  function stop(){running=false;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}
    video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);
    $('start').disabled=false;$('stop').disabled=true;$('empty').style.display='flex';$('mode').textContent='실험용 시제품';
    $('quality').textContent='대기 중';msg('탐색이 종료되었습니다.');reset();}
  $('start').addEventListener('click',start);$('stop').addEventListener('click',stop);
  $('clear').addEventListener('click',()=>{reset();msg('추적 기록을 초기화했습니다.');});
  $('resolution').addEventListener('change',()=>{if(running)configure();});
  $('sensitivity').addEventListener('change',()=>{tracks=[];});
  window.addEventListener('resize',resizeOverlay);window.addEventListener('pagehide',stop);resizeOverlay();
})();

</script>
</body>
</html>
